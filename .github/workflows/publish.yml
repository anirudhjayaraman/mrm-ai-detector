name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# no API token is stored in the repository. One-time setup on pypi.org:
# Account settings -> Publishing -> add a trusted publisher for
# owner "anirudhjayaraman", repo "mrm-ai-detector", workflow "publish.yml",
# environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
