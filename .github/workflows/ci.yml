name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Zero-install smoke test (stdlib only)
        run: python -m mrm_ai_detector scan examples --summary
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check mrm_ai_detector tests
      - name: Test
        run: pytest
