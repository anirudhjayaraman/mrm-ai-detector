[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mrm-ai-detector"
dynamic = ["version"]
description = "Detect AI-generated content in model risk management documentation (validation reports, model documentation, MRM policies)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mrm-ai-detector contributors" }]
keywords = ["ai-detection", "model-risk", "model-validation", "sr-11-7", "ss1-23", "llm", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []  # the core detector is pure standard library

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
email = ["olefile>=0.46"]
ocr = ["rapidocr-onnxruntime>=1.2", "pillow>=9", "pillow-heif>=0.13"]
lm = ["torch>=2.1", "transformers>=4.44"]
all = ["pypdf>=4.0", "olefile>=0.46", "rapidocr-onnxruntime>=1.2", "pillow>=9", "pillow-heif>=0.13", "torch>=2.1", "transformers>=4.44"]
dev = ["pytest>=7", "ruff>=0.5", "pypdf>=4.0"]

[project.scripts]
mrm-detect = "mrm_ai_detector.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mrm_ai_detector.__version__" }

[tool.setuptools.packages.find]
include = ["mrm_ai_detector*"]

[tool.setuptools.package-data]
mrm_ai_detector = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B905"]
